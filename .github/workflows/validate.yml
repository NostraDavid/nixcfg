name: Validate

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - name: Run project hooks, formatting and lint
        run: |
          nix shell \
            .#legacyPackages.x86_64-linux.just \
            .#legacyPackages.x86_64-linux.prek \
            .#legacyPackages.x86_64-linux.alejandra \
            .#legacyPackages.x86_64-linux.dprint \
            .#legacyPackages.x86_64-linux.shfmt \
            .#legacyPackages.x86_64-linux.stylua \
            .#legacyPackages.x86_64-linux.ruff \
            .#legacyPackages.x86_64-linux.shellcheck \
            .#legacyPackages.x86_64-linux.markdownlint-cli \
            .#legacyPackages.x86_64-linux.selene \
            .#legacyPackages.x86_64-linux.statix \
            .#legacyPackages.x86_64-linux.deadnix \
            --command bash -e -c '
              just hooks-run
              just check
              just lint
            '
      - name: Evaluate the flake
        run: nix flake check --no-build
      - name: Reject insecure package exceptions
        run: |
          if grep -R --include='*.nix' -n 'permittedInsecurePackages' .; then
            exit 1
          fi
      - name: Validate OpenTofu
        run: |
          nix shell \
            .#legacyPackages.x86_64-linux.just \
            .#legacyPackages.x86_64-linux.opentofu \
            --command bash -e -c '
              tofu -chdir=infra/proxmox init -backend=false
              just tofu-proxmox-check
            '

  security:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v20
      - name: Generate and scan Wodan SBOM
        run: |
          nix shell \
            .#legacyPackages.x86_64-linux.just \
            .#legacyPackages.x86_64-linux.sbomnix \
            .#legacyPackages.x86_64-linux.osv-scanner \
            .#legacyPackages.x86_64-linux.grype \
            .#legacyPackages.x86_64-linux.vulnix \
            --command bash -e -c '
              just security-sbom wodan reports/security
              just security-osv wodan reports/security
              just security-grype wodan reports/security critical
              just security-vulnix wodan true
            '
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security
          if-no-files-found: warn
