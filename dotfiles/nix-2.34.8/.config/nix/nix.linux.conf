# Kerninstelling voor multi-user builds; default is machine-specific (`nixbld` als root, anders leeg).
# Niet Linux-specifiek: op macOS beheert nix-darwin dit via /etc/nix/nix.conf.
build-users-group = nixbld
# Sandbox builds op Linux; default is `true`.
sandbox = true
# Interne builddir in Linux sandboxes; default is `/build`.
sandbox-build-dir = /build
# Grootte van `/dev/shm` in Linux sandboxes; default is `50%`.
sandbox-dev-shm-size = 50%
