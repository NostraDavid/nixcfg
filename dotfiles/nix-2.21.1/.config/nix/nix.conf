# https://nix.dev/manual/nix/2.34/command-ref/conf-file
# Kerninstelling voor multi-user builds; default is machine-specific (`nixbld` als root, anders leeg).
build-users-group = nixbld

# --- CLI en flakes ----------------------------------------------------------

# Schakel de moderne CLI en flakes in; default is leeg.
experimental-features = nix-command flakes
# Gebruik de globale flake registry; default is `true`.
use-registries = true
# Globale flake registry URL; default is `https://channels.nixos.org/flake-registry.json`.
flake-registry = https://channels.nixos.org/flake-registry.json
# Gebruik de flake evaluation cache; default is `true`.
eval-cache = true
# Maak geen dirty locks aan; default is `false`.
allow-dirty-locks = false

# Allow this repo's `nixConfig` (e.g. binary cache settings in `./flake.nix`)
# without prompting after Home Manager has linked this file into place.
# Accepteer flake-config zonder prompt; default is `false`.
accept-flake-config = true

# --- Trust en binary caches -------------------------------------------------

# Gebruik binary substitutes als ze beschikbaar zijn; default is `true`.
substitute = true
# Actieve caches voor deze machine; default is alleen `https://cache.nixos.org/`.
substituters = https://thaumatorium.cachix.org https://devenv.cachix.org https://nix-community.cachix.org https://numtide.cachix.org https://cache.nixos.org
# Vereis geldige signatures voor niet-content-addressed paths; default is `true`.
require-sigs = true
# Publieke sleutels voor de geconfigureerde caches; default is alleen cache.nixos.org.
trusted-public-keys = thaumatorium.cachix.org-1:KbOXBN34Tv0AeoRRhvBKoZHUfgmOALmfyQWeRE6MITo= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= numtide.cachix.org-1:2ps1kLBUWjxIneOy1Ik6cQjb41X0iXVXeHigGmycPPE= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
# Extra substituters die ongetrustte users mogen kiezen; default is leeg.
# trusted-substituters =
# Users met daemon-rootmachtigingen; default is `root`.
trusted-users = root david
# Users die met de daemon mogen praten; default is `*`.
allowed-users = *

# Cache trust intentionally lives in the repo root `flake.nix`, so bootstrap
# commands can use it before Home Manager has linked `~/.config/nix/nix.conf`.

# --- Evaluatie en debugging -------------------------------------------------

# Toon stack traces bij evaluatiefouten; default is `false`.
show-trace = false
# Waarschuw voor dirty git/hg trees; default is `true`.
warn-dirty = true
# Pure evaluatie uit; default is `false`.
pure-eval = false
# Beperk eval-toegang tot nixPath/allowed-uris; default is `false`.
restrict-eval = false
# Sta import-from-derivation toe; default is `true`.
allow-import-from-derivation = true
# Log import-from-derivation gebruik; default is `false`.
trace-import-from-derivation = false

# --- Buildisolatie en parallelisme -----------------------------------------

# Sandbox builds op Linux; default is `true` op Linux en `false` elders.
sandbox = true
# Val terug als sandboxing niet beschikbaar is; default is `true`.
sandbox-fallback = true
# Extra bind mounts in de sandbox; default is leeg of build-specifiek.
# sandbox-paths =
# Interne builddir in Linux sandboxes; default is `/build`.
sandbox-build-dir = /build
# Grootte van `/dev/shm` in Linux sandboxes; default is `50%`.
sandbox-dev-shm-size = 50%
# Beperk het aantal lokale builds; default is `1`.
max-jobs = 4
# Beperk builder-parallelisme per job; default is `0` (auto-detecteer alle cores).
cores = 7
# Poll locks elke 5 seconden; default is `5`.
build-poll-interval = 5
# Stop niet door op eerste fout; default is `false`.
keep-going = false
# Geen algemene build-timeout; default is `0`.
timeout = 0
# Geen silent-timeout voor builders; default is `0`.
max-silent-time = 0
# Geen limiet op buildlog-grootte; default is `0`.
max-build-log-size = 0

# --- Logging en retentie ----------------------------------------------------

# Bewaar build logs; default is `true`.
keep-build-log = true
# Comprimeer build logs; default is `true`.
compress-build-log = true
# Toon wat er nog gebouwd of gedownload moet worden; default is `true`.
print-missing = true
# Aantal logregels bij build failure; default is `25`.
log-lines = 25
# Houd derivaties vast voor traceerbaarheid; default is `true`.
keep-derivations = true
# Houd build-only outputs niet extra vast; default is `false`.
keep-outputs = false
# Bewaar mislukte builddirs niet; default is `false`.
keep-failed = false

# --- Downloads en substitutiegedrag ----------------------------------------

# Download maximaal 5 keer opnieuw; default is `5`.
download-attempts = 5
# Interne downloadbuffer van 1 MiB; default is `1048576`.
download-buffer-size = 1048576
# Geen download-snelheidslimiet; default is `0`.
download-speed = 0
# Connect-timeout voor downloads; default is `15`.
connect-timeout = 15
# Timeout voor stilgevallen downloads; default is `300`.
stalled-download-timeout = 300
# Maximaal 25 parallelle HTTP-verbindingen; default is `25`.
http-connections = 100
# Gebruik HTTP/2 waar mogelijk; default is `true`.
http2 = true
# Hercontroleer tarballs na een uur; default is `3600`.
tarball-ttl = 3600
# Maximaal 16 substitutie-jobs parallel; default is `16`.
max-substitution-jobs = 16
# Gebruik geen source fallback als substitutie mist; default is `false`.
fallback = false
# Laat remote builders niet hun eigen substituters gebruiken; default is `false`.
builders-use-substitutes = false
# Geen remote builders geconfigureerd; default is machine-specific.
# builders =

# --- Garbage collection en store onderhoud ---------------------------------

# Start een GC niet op basis van vrije ruimte; default is `0`.
min-free = 0
# Stop GC pas bij 'alles opgeruimd'; default is `9223372036854775807`.
max-free = 9223372036854775807
# Check vrije ruimte elke 5 seconden; default is `5`.
min-free-check-interval = 5
# Reserveer 8 MiB voor de GC; default is `8388608`.
gc-reserved-space = 8388608
# Optimaliseer de store niet automatisch; default is `false`.
auto-optimise-store = false

# --- Store en lokale database ----------------------------------------------

# Gebruik de lokale/auto store; default is `auto`.
store = auto
# Volg XDG nog niet voor oude Nix-paden; default is `false`.
use-xdg-base-directories = false
# Gebruik SQLite WAL mode; default is `true`.
use-sqlite-wal = true
# Sync store metadata naar disk; default is `true`.
fsync-metadata = true
# Fsync store paths niet expliciet; default is `false`.
fsync-store-paths = false
# Roep geen globale `sync()` aan bij registreren; default is `false`.
sync-before-registering = false

# --- Lokale overrides -------------------------------------------------------

# Optional per-host overrides kept outside the repo.
# This path is relative to this file, i.e. `~/.config/nix/nix.local.conf`.
# Laad host-specifieke overrides optioneel in; `!include` faalt niet als het bestand ontbreekt.
!include nix.local.conf
