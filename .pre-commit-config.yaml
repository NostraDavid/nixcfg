default_stages: [pre-commit]

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  - repo: local
    hooks:
      - id: check-module-map
        name: check module map analysis
        entry: python3 checks/test-module-map.py
        language: system
        files: "^(scripts/module(_map\\.py|-graph\\.nix|-map\\.html)|checks/test-module-map\\.py|\\.pre-commit-config\\.yaml)$"
        pass_filenames: false

      - id: check-architecture
        name: check Den architecture and effective configuration policies
        entry: just architecture-check
        language: system
        files: '^(features/|profiles/|hosts/|nix/|policy/|flake\.(nix|lock)$|checks/test-architecture\.py$|\.pre-commit-config\.yaml$)'
        pass_filenames: false

      - id: check-bootstrap-host
        name: check native Den host bootstrap
        entry: bash checks/test-bootstrap-host.sh
        language: system
        files: '^(scripts/bootstrap-host\.sh|checks/test-bootstrap-host\.sh|hosts/default\.nix)$'
        pass_filenames: false

      - id: check-nix-index
        name: check initial nix-index generation
        entry: bash checks/test-nix-index.sh
        language: system
        files: '^(features/nix-index/|checks/test-nix-index\.sh$)'
        pass_filenames: false

      - id: check-dbhub
        name: check DBHub local SQLite connection
        entry: node checks/test-dbhub.mjs
        language: system
        files: '^(pkgs/dbhub/|features/mcp/|checks/test-dbhub\.mjs$)'
        pass_filenames: false

      - id: check-loki-mcp
        name: check stable MCP launchers and client configuration
        entry: bash checks/test-loki-mcp.sh
        language: system
        files: '^(features/(mcp|codex-browser|portable-runtime)/|profiles/|hosts/|nix/|checks/(loki-mcp\.nix|test-loki-mcp\.sh)$|pkgs/(headroom|dbhub)/|dotfiles/(codex-[^/]+/\.codex/config\.toml|copilot-[^/]+/\.copilot/mcp-config\.json|mcp/\.config/mcp/mcp\.json|vscode-[^/]+/\.config/Code/User/mcp\.json|opencode-[^/]+/\.config/opencode/opencode\.jsonc)$)'
        pass_filenames: false

      - id: check-video-explainer
        name: check video renderer logic
        entry: dotfiles/agents/.agents/video-explainer/scripts/render.py unit-test
        language: system
        files: "^(dotfiles/agents/\\.agents/video-explainer/|pkgs/video-explainer/|checks/fixtures/video-explainer/|\\.pre-commit-config\\.yaml$)"
        pass_filenames: false

      - id: check-pi-parity
        name: check Pi workflow extensions against pinned SDK
        entry: node --test checks/pi-parity.test.mjs
        language: system
        files: '^(dotfiles/pi-[^/]+/|checks/(pi-parity\.test\.mjs$|fixtures/pi-mcp-server\.mjs$)|features/mcp/|flake\.lock$)'
        pass_filenames: false

      - id: check-repos-providers
        name: check repos provider interfaces and tests
        entry: dotfiles/ndtk/tests/test_git_repos.py
        language: system
        files: "^(dotfiles/ndtk/\\.local/bin/(repos\\.sh|_repos_.*\\.py|_repo_checkouts\\.py)$|dotfiles/ndtk/tests/test_git_repos\\.py$|\\.pre-commit-config\\.yaml$)"
        pass_filenames: false

      - id: check-agent-instructions
        name: check agent instructions and skill links
        entry: just check-agent-instructions
        language: system
        files: "^(dotfiles/agents/|features/dotfiles/|nix/|checks/)"
        pass_filenames: false

      - id: check-loki-keyboard
        name: check Loki keyboard profile and migration
        entry: bash checks/test-loki-keyboard.sh
        language: system
        files: '^(flake\.(nix|lock)$|features/darwin-keyboard/|nix/|hosts/physical/loki/|checks/(loki-keyboard\.nix|test-loki-keyboard\.sh)$|dotfiles/vscode-[^/]+/\.config/Code/User/keybindings\.json$)'
        pass_filenames: false

      - id: check-opencode-v2
        name: check OpenCode v2 configuration and service
        entry: bash checks/test-opencode-v2.sh
        language: system
        files: '^(pkgs/opencode-v2/|checks/test-opencode-v2\.sh$|dotfiles/opencode-(work-)?2[^/]+/|features/(portable-runtime|development|workstation-extra)/)'
        pass_filenames: false

      - id: check-release-updaters
        name: check package release updaters
        entry: bash scripts/test-release-updaters.sh
        language: system
        files: "^scripts/(update-opencode-v2(-desktop)?|update-headroom|update-cmux-tui|update-databricks-agent-skills|test-release-updaters)\\.sh$"
        pass_filenames: false

      - id: check-alejandra
        name: check Nix formatting (alejandra, local)
        entry: just check-alejandra-files
        language: system
        files: "\\.nix$"

      - id: check-dprint
        name: check web/config formatting (dprint, local)
        entry: just check-dprint-files
        language: system
        files: "(\\.(c|m)?[jt]sx?$|\\.jsonc?$|\\.md$|\\.html?$|\\.ya?ml$|\\.toml$|\\.(css|scss|sass|less|xml|dockerfile)$|(^|/)Dockerfile(\\.[^/]*)?$)"
        exclude: "^dotfiles/agents/\\.agents/|^docs/agentskills\\.io/"

      - id: check-shfmt
        name: check shell formatting (shfmt, local)
        entry: just check-shfmt-files
        language: system
        files: "(\\.sh$|\\.bashrc$|\\.bash_aliases$)"

      - id: check-stylua
        name: check Lua formatting (stylua, local)
        entry: just check-stylua-files
        language: system
        files: "\\.lua$"

      - id: check-ruff-format
        name: check Python formatting (ruff, local)
        entry: just check-ruff-format-files
        language: system
        files: "(\\.py$|^dotfiles/git-2.49.0/\\.config/git/hooks/commit-msg$)"

      - id: lint-ruff
        name: lint Python (ruff, local)
        entry: just lint-ruff-files
        language: system
        files: "(\\.py$|^dotfiles/git-2.49.0/\\.config/git/hooks/commit-msg$)"

      - id: check-ruff-config
        name: check Python lint rules after Ruff configuration changes
        entry: just lint-ruff
        language: system
        files: "^ruff\\.toml$"
        pass_filenames: false

      - id: lint-shellcheck
        name: lint shell (shellcheck, local)
        entry: just lint-shellcheck-files
        language: system
        files: "(\\.sh$|\\.bashrc$|\\.bash_aliases$)"

      - id: lint-markdown
        name: lint Markdown (markdownlint, local)
        entry: just lint-markdown-files
        language: system
        files: "\\.md$"
        exclude: "^docs/agentskills\\.io/"

      - id: lint-selene
        name: lint Lua (selene, local)
        entry: just lint-selene-files
        language: system
        files: "\\.lua$"

      - id: lint-statix
        name: lint Nix (statix, local)
        entry: just lint-statix-files
        language: system
        files: "\\.nix$"

      - id: lint-deadnix
        name: lint Nix dead code (deadnix, local)
        entry: just lint-deadnix-files
        language: system
        files: "\\.nix$"
